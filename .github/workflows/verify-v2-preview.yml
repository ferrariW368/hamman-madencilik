name: Verify V2 Preview

on:
  push:
    branches:
      - redesign/v2

permissions:
  contents: read

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_dxWcRGWzCk66pNRfif8b2JzTALby
      VERCEL_TEAM_ID: team_8FR6kgNJGmL5ws2Pm7gCnnFb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for this commit's Vercel preview
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          api_url="https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}&meta-githubCommitSha=${GITHUB_SHA}&limit=1"

          for attempt in {1..36}; do
            response="$(curl --fail --silent --show-error --header "Authorization: Bearer ${VERCEL_TOKEN}" "${api_url}")"
            preview_url="$(node -e '
              const input = require("fs").readFileSync(0, "utf8");
              const deployment = JSON.parse(input).deployments?.[0];
              if (!deployment || deployment.state !== "READY") process.exit(1);
              process.stdout.write(`https://${deployment.url}`);
            ' <<< "${response}")" || true

            if [[ -n "${preview_url}" ]]; then
              echo "url=${preview_url}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for a Ready Vercel preview for ${GITHUB_SHA}." >&2
          exit 1

      - name: Verify V2 preview
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: npm run verify:preview
